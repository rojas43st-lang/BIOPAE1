
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner BIOPAE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #222;
        }

        h1 {
            margin-bottom: 5px;
        }

        #tipoAlimento {
            font-size: 20px;
            font-weight: bold;
            margin: 15px;
        }

        .inventario {
            max-width: 500px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 15px;
        }

        .tarjeta {
            padding: 20px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
            border-top: 5px solid #43884b;
        }

        .tarjeta.almuerzo {
            border-top-color: #e6a23c;
        }

        .tarjeta h3 {
            margin: 0 0 12px;
            font-size: 19px;
        }

        .cantidad {
            font-size: 38px;
            font-weight: bold;
            color: #26743a;
        }

        .almuerzo .cantidad {
            color: #b87512;
        }

        .estado-inventario {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            background: white;
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        #resultado {
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            display: none;
        }

        #mensaje {
            margin-top: 15px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .boton {
            display: inline-block;
            border: none;
            padding: 14px 25px;
            margin: 8px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }

        .nuevo {
            background: #26743a;
            color: white;
        }

        .volver {
            background: #777;
            color: white;
        }

        .recargar {
            padding: 10px 16px;
            background: #e2e8f0;
            color: #222;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <h1>📷 Escáner BIOPAE</h1>

    <p>Escanea el código QR del estudiante</p>

    <div id="tipoAlimento"></div>

    <!-- INVENTARIO DEL ALIMENTO SELECCIONADO -->

    <section class="inventario">

        <div class="tarjeta" id="tarjetaVasos">
            <h3>🥛 Vasos de leche disponibles</h3>

            <div class="cantidad" id="cantidadVasos">--</div>

            <div class="estado-inventario" id="estadoVasos">
                Consultando...
            </div>
        </div>

        <div class="tarjeta almuerzo" id="tarjetaAlmuerzos">
            <h3>🍽️ Almuerzos disponibles</h3>

            <div class="cantidad" id="cantidadAlmuerzos">--</div>

            <div class="estado-inventario" id="estadoAlmuerzos">
                Consultando...
            </div>
        </div>

    </section>

    <button
        class="recargar"
        type="button"
        onclick="cargarInventario()"
    >
        🔄 Actualizar cantidad
    </button>

    <!-- ESCÁNER QR -->

    <div id="reader"></div>

    <!-- RESULTADO DEL ESCANEO -->

    <div id="resultado">

        <h2>📋 Resultado del escaneo</h2>

        <p>
            ID del estudiante:
            <strong id="codigo"></strong>
        </p>

        <p id="mensaje" aria-live="polite"></p>

        <button
            class="boton nuevo"
            onclick="nuevoEscaneo()"
        >
            📷 Escanear otro
        </button>

        <a
            id="volver"
            class="boton volver"
            href="/menu"
        >
            ⬅ Volver al menú
        </a>

    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script>
        // ================================================
        // ALIMENTO SELECCIONADO
        // ================================================

        const alimentoId = Number("{{ alimento_id }}");

        const tipoAlimento =
            document.getElementById("tipoAlimento");

        const volver =
            document.getElementById("volver");

        const tarjetaVasos =
            document.getElementById("tarjetaVasos");

        const tarjetaAlmuerzos =
            document.getElementById("tarjetaAlmuerzos");

        if (alimentoId === 1) {

            tipoAlimento.textContent = "🥛 Vaso de leche";

            tarjetaVasos.style.display = "block";
            tarjetaAlmuerzos.style.display = "none";

        } else if (alimentoId === 2) {

            tipoAlimento.textContent = "🍽️ Almuerzo";

            tarjetaVasos.style.display = "none";
            tarjetaAlmuerzos.style.display = "block";

        } else {

            tipoAlimento.textContent = "Alimento no válido";

            tarjetaVasos.style.display = "none";
            tarjetaAlmuerzos.style.display = "none";

        }

        // ================================================
        // CONSULTAR CANTIDAD DEL ALIMENTO SELECCIONADO
        // ================================================

        async function cargarInventario() {

            const elementoCantidad =
                alimentoId === 1
                    ? document.getElementById("cantidadVasos")
                    : document.getElementById("cantidadAlmuerzos");

            const elementoEstado =
                alimentoId === 1
                    ? document.getElementById("estadoVasos")
                    : document.getElementById("estadoAlmuerzos");

            if (![1, 2].includes(alimentoId)) {
                elementoCantidad.textContent = "--";
                return;
            }

            elementoEstado.textContent = "Consultando Neon...";

            try {

                const respuesta = await fetch(
                    `/api/alimentos/${alimentoId}`,
                    { cache: "no-store" }
                );

                const datos = await respuesta.json();

                if (!respuesta.ok || !datos.ok) {
                    throw new Error(
                        datos.mensaje || "No se pudo consultar el alimento."
                    );
                }

                elementoCantidad.textContent = datos.cantidad;

                if (datos.activo === false) {

                    elementoEstado.textContent = "Alimento inactivo";

                } else if (Number(datos.cantidad) <= 0) {

                    elementoEstado.textContent = "Agotado";

                } else {

                    elementoEstado.textContent = "Unidades disponibles";

                }

            } catch (error) {

                console.error("Error consultando inventario:", error);

                elementoCantidad.textContent = "--";
                elementoEstado.textContent = "Error al consultar";
            }
        }

        // ================================================
        // VARIABLES DEL ESCÁNER
        // ================================================

        let codigoEscaneado = null;
        let escanerActivo = true;
        let procesandoEntrega = false;

        // ================================================
        // QR ENCONTRADO
        // ================================================

        async function cuandoEscaneaQR(texto) {

            if (!escanerActivo || procesandoEntrega) {
                return;
            }

            escanerActivo = false;
            procesandoEntrega = true;

            codigoEscaneado = texto.trim();

            document.getElementById("codigo").textContent =
                codigoEscaneado;

            document.getElementById("resultado").style.display =
                "block";

            try {
                await scanner.clear();
            } catch (error) {
                console.log("No se pudo detener el escáner:", error);
            }

            await registrarEntrega();
        }

        // ================================================
        // ERRORES DEL LECTOR
        // ================================================

        function errorEscaneo(error) {
            // Se ejecuta mientras el lector busca un QR.
        }

        // ================================================
        // CREAR ESCÁNER
        // ================================================

        const scanner = new Html5QrcodeScanner(
            "reader",
            {
                fps: 10,
                qrbox: {
                    width: 250,
                    height: 250
                }
            },
            false
        );

        if ([1, 2].includes(alimentoId)) {
            scanner.render(cuandoEscaneaQR, errorEscaneo);
        } else {
            document.getElementById("reader").textContent =
                "Selecciona un alimento válido desde el menú.";
        }

        // ================================================
        // REGISTRAR ENTREGA
        // ================================================

        async function registrarEntrega() {

            if (!codigoEscaneado) {
                procesandoEntrega = false;
                return;
            }

            const mensaje =
                document.getElementById("mensaje");

            const estudianteId = Number(codigoEscaneado);

            if (
                !Number.isInteger(estudianteId) ||
                estudianteId <= 0
            ) {
                mensaje.textContent =
                    "❌ El QR no contiene un ID válido.";

                procesandoEntrega = false;
                return;
            }

            mensaje.textContent = "⏳ Registrando entrega...";

            try {

                const respuesta = await fetch(
                    "/api/escaneo",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            estudiante_id: estudianteId,
                            alimento_id: alimentoId
                        })
                    }
                );

                const datos = await respuesta.json();

                if (respuesta.ok && datos.ok) {

                    mensaje.textContent =
                        `✅ ${datos.estudiante} recibió ${datos.alimento}. ` +
                        `Quedan ${datos.cantidad_restante} disponibles.`;

                    await cargarInventario();

                } else {

                    mensaje.textContent =
                        "❌ " +
                        (datos.mensaje || "No se pudo registrar la entrega.");

                    await cargarInventario();

                }

            } catch (error) {

                console.error("Error registrando entrega:", error);

                mensaje.textContent =
                    "❌ Error de conexión con BIOPAE. " +
                    "Comprueba las entregas antes de volver a escanear.";

            }
        }

        // ================================================
        // NUEVO ESCANEO
        // ================================================

        function nuevoEscaneo() {
            location.reload();
        }

        // ================================================
        // CARGAR CANTIDAD AL ABRIR LA PÁGINA
        // ================================================

        cargarInventario();

    </script>

</body>
</html>
