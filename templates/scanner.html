
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner BIOPAE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #222;
        }

        h1 {
            margin-bottom: 5px;
        }

        #tipoAlimento {
            font-size: 20px;
            font-weight: bold;
            margin: 15px;
        }

        .inventario {
            max-width: 650px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
        }

        .tarjeta {
            padding: 20px 12px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
            border-top: 5px solid #43884b;
        }

        .tarjeta.almuerzo {
            border-top-color: #e6a23c;
        }

        .tarjeta h3 {
            margin: 0 0 12px;
            font-size: 17px;
        }

        .cantidad {
            font-size: 34px;
            font-weight: bold;
            color: #26743a;
        }

        .almuerzo .cantidad {
            color: #b87512;
        }

        .estado-inventario {
            margin-top: 10px;
            font-size: 13px;
            color: #555;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            background: white;
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        #resultado {
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            display: none;
        }

        #mensaje {
            margin-top: 15px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .boton {
            display: inline-block;
            border: none;
            padding: 14px 25px;
            margin: 8px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }

        .nuevo {
            background: #26743a;
            color: white;
        }

        .volver {
            background: #777;
            color: white;
        }

        .recargar {
            padding: 9px 15px;
            background: #e2e8f0;
            color: #222;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        @media (max-width: 420px) {
            body {
                padding: 12px;
            }

            .inventario {
                gap: 8px;
            }

            .tarjeta {
                padding: 15px 8px;
            }

            .tarjeta h3 {
                font-size: 14px;
            }

            .cantidad {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <h1>📷 Escáner BIOPAE</h1>
    <p>Escanea el código QR del estudiante</p>

    <div id="tipoAlimento"></div>

    <!-- CANTIDADES DISPONIBLES -->
    <section class="inventario">

        <div class="tarjeta">
            <h3>🥛 Vasos de leche</h3>
            <div class="cantidad" id="cantidadVasos">--</div>
            <div class="estado-inventario" id="estadoVasos">
                Consultando Neon...
            </div>
        </div>

        <div class="tarjeta almuerzo">
            <h3>🍽️ Almuerzos</h3>
            <div class="cantidad" id="cantidadAlmuerzos">--</div>
            <div class="estado-inventario" id="estadoAlmuerzos">
                Consultando Neon...
            </div>
        </div>

    </section>

    <button class="recargar" type="button" onclick="cargarInventario()">
        🔄 Actualizar cantidades
    </button>

    <div id="reader"></div>

    <div id="resultado">

        <h2>📋 Resultado del escaneo</h2>

        <p>
            ID del estudiante:
            <strong id="codigo"></strong>
        </p>

        <p id="mensaje" aria-live="polite"></p>

        <button class="boton nuevo" onclick="nuevoEscaneo()">
            📷 Escanear otro
        </button>

        <a id="volver" class="boton volver" href="/menu">
            ⬅ Volver
        </a>

    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script>
        // ALIMENTO SELECCIONADO

        const alimentoId = Number("{{ alimento_id }}");

        const tipoAlimento = document.getElementById("tipoAlimento");
        const volver = document.getElementById("volver");

        if (alimentoId === 1) {
            tipoAlimento.textContent = "🥛 Vaso de leche";
            volver.href = "/menu";
        } else if (alimentoId === 2) {
            tipoAlimento.textContent = "🍽️ Almuerzo";
            volver.href = "/menu";
        } else {
            tipoAlimento.textContent = "Alimento no válido";
        }

        // CONSULTAR CANTIDADES REALES EN NEON

        async function cargarInventario() {
            const elementos = [
                {
                    id: 1,
                    cantidad: document.getElementById("cantidadVasos"),
                    estado: document.getElementById("estadoVasos")
                },
                {
                    id: 2,
                    cantidad: document.getElementById("cantidadAlmuerzos"),
                    estado: document.getElementById("estadoAlmuerzos")
                }
            ];

            await Promise.all(elementos.map(async function(item) {
                item.estado.textContent = "Consultando Neon...";

                try {
                    const respuesta = await fetch(
                        `/api/alimentos/${item.id}`,
                        { cache: "no-store" }
                    );

                    const datos = await respuesta.json();

                    if (!respuesta.ok || !datos.ok) {
                        throw new Error(
                            datos.mensaje || "No se pudo consultar"
                        );
                    }

                    item.cantidad.textContent = datos.cantidad;

                    if (datos.activo === false) {
                        item.estado.textContent = "Alimento inactivo";
                    } else if (datos.cantidad <= 0) {
                        item.estado.textContent = "Agotado";
                    } else {
                        item.estado.textContent = "Disponibles";
                    }

                } catch (error) {
                    console.error(
                        `Error consultando alimento ${item.id}:`,
                        error
                    );

                    item.cantidad.textContent = "--";
                    item.estado.textContent = "Error al consultar";
                }
            }));
        }

        // VARIABLES DEL ESCÁNER

        let codigoEscaneado = null;
        let escanerActivo = true;
        let procesandoEntrega = false;

        // QR ENCONTRADO

        async function cuandoEscaneaQR(texto) {
            if (!escanerActivo || procesandoEntrega) {
                return;
            }

            escanerActivo = false;
            procesandoEntrega = true;
            codigoEscaneado = texto.trim();

            document.getElementById("codigo").textContent =
                codigoEscaneado;

            document.getElementById("resultado").style.display = "block";

            try {
                await scanner.clear();
            } catch (error) {
                console.log("No se pudo detener el escáner:", error);
            }

            await registrarEntrega();
        }

        // ERRORES DEL LECTOR

        function errorEscaneo(error) {
            // El lector busca continuamente un código QR.
        }

        // CREAR ESCÁNER

        const scanner = new Html5QrcodeScanner(
            "reader",
            {
                fps: 10,
                qrbox: {
                    width: 250,
                    height: 250
                }
            },
            false
        );

        if ([1, 2].includes(alimentoId)) {
            scanner.render(cuandoEscaneaQR, errorEscaneo);
        } else {
            document.getElementById("reader").textContent =
                "No se ha seleccionado un alimento válido.";
        }

        // REGISTRAR ENTREGA

        async function registrarEntrega() {
            const mensaje = document.getElementById("mensaje");

            if (!codigoEscaneado) {
                procesandoEntrega = false;
                return;
            }

            const estudianteId = Number(codigoEscaneado);

            if (!Number.isInteger(estudianteId) || estudianteId <= 0) {
                mensaje.textContent =
                    "❌ El QR no contiene un ID válido.";
                procesandoEntrega = false;
                return;
            }

            mensaje.textContent = "⏳ Registrando entrega...";

            try {
                const respuesta = await fetch("/api/escaneo", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        estudiante_id: estudianteId,
                        alimento_id: alimentoId
                    })
                });

                const datos = await respuesta.json();

                if (respuesta.ok && datos.ok) {
                    mensaje.textContent =
                        `✅ ${datos.estudiante} recibió ${datos.alimento}. ` +
                        `Quedan ${datos.cantidad_restante} disponibles.`;

                    // Actualizar las dos cantidades desde Neon.
                    await cargarInventario();

                } else {
                    mensaje.textContent =
                        "❌ " +
                        (datos.mensaje || "No se pudo registrar la entrega.");

                    // Consultar de nuevo por si cambió el inventario.
                    await cargarInventario();
                }

            } catch (error) {
                console.error(error);

                mensaje.textContent =
                    "❌ Error de conexión con BIOPAE. " +
                    "Verifica el estado de la entrega antes de volver a escanear.";
            }
        }

        // NUEVO ESCANEO

        function nuevoEscaneo() {
            location.reload();
        }

        // CONSULTAR AL ABRIR LA PÁGINA

        cargarInventario();
    </script>

</body>
</html>
