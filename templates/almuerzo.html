<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <title>Almuerzos</title>

  <link
    rel="stylesheet"
    href="/static/css/styles.css"
  >

</head>

<body>

  <div class="container">

    <h1>Almuerzos restantes</h1>

    <h2 id="numero">Cargando...</h2>

    <a href="/scanner?alimento=2">

      <img
        id="escaner"
        src="/static/imagenes/pnwe-removebg-preview (1).png"
        alt="Escanear almuerzo"
      >

    </a>

    <p>
      📷 Escanea el QR del estudiante
    </p>

    <div class="volver">

      <a href="/menu">
        ⬅ Volver al menú
      </a>

    </div>

  </div>


  <script>
document.addEventListener('DOMContentLoaded', function () {

    const numeroEl = document.getElementById('numero');
    const escanerImg = document.getElementById('escaner');
    const btnRegalado = document.getElementById('regalado');

    const ALIMENTO_ID = 2;

    async function cargarCantidad() {

        try {

            const respuesta = await fetch(`/api/alimentos/${ALIMENTO_ID}`);

            const datos = await respuesta.json();

            if (!datos.ok) {
                alert(datos.mensaje);
                return;
            }

            numeroEl.textContent = datos.cantidad;

        } catch (error) {

            console.error(error);

            alert("No se pudo consultar la cantidad de almuerzos.");

        }
    }


    async function descontar() {

        try {

            const respuesta = await fetch(
                `/api/alimentos/${ALIMENTO_ID}/descontar`,
                {
                    method: "POST"
                }
            );

            const datos = await respuesta.json();

            if (!respuesta.ok || !datos.ok) {

                alert(datos.mensaje || "No se pudo descontar el almuerzo.");

                return;
            }

            numeroEl.textContent = datos.cantidad;

            if (datos.cantidad === 0) {

                alert("Almuerzos del día de hoy terminados.");

            }

        } catch (error) {

            console.error(error);

            alert("Error de conexión con el servidor.");

        }
    }


    escanerImg.addEventListener('click', descontar);

    btnRegalado.addEventListener('click', descontar);

    cargarCantidad();

});
</script>

</body>

</html>
