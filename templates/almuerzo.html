<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almuerzos - BIOPAE</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <main class="container">
    <h1>Almuerzos restantes</h1>

    <section id="cantidad-alimento"
             aria-live="polite"
             hx-get="/fragmentos/alimentos/2/cantidad"
             hx-trigger="load, every 30s"
             hx-swap="innerHTML">
      Cargando cantidad...

    <a href="/scanner?alimento=2">
      <img src="/static/imagenes/pnwe-removebg-preview (1).png"
           alt="Abrir escáner de almuerzos">
    </a>

    <p>📷 Escanea el QR del estudiante para registrar la entrega.</p>

    <div class="volver">
      <a href="/menu">⬅ Volver al menú</a>
    </div>
  </main>
</body>
</html>
